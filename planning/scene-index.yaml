schema_version: 1
scenes:
  - id: "01.01"
    file: "manuscript/01.01-the-chase.md"
    title: "The Chase"
    date: "December 1863"
    pov: "Documentary narrator, limited around Nicholas Tiebolt"
    location: "Alder Gulch and the road near Dempsey's ranch"
    purpose: "Establish the frontier setting and institutional void, follow Tiebolt's pursuit and incapacitation, and create the demand for justice"
    status: "draft"
    participants:
      - "Nicholas Tiebolt"
      - "George Ives"
    entry_state: "Alder Gulch is rich, newly settled, and beyond effective territorial protection; Tiebolt is returning for mules with gold on his person"
    turn: "An unidentified pursuit resolves into George Ives overtaking Tiebolt"
    exit_state: "Tiebolt is barely alive, his gold is gone, and the narrative has established a need for justice without revealing the killing's gruesome details"
    must_not_reveal:
      - "The detailed mechanics and injuries associated with Tiebolt's death before the trial proceedings"
      - "The alleged road-agent network as settled historical fact"
  - id: "02.01"
    file: "manuscript/02.01-the-gulch.md"
    title: "The Gulch"
    date: "May–December 1863"
    pov: "Documentary narrator, moving among Henry Edgar and the Sheehan household"
    location: "Alder Gulch, principally Virginia City"
    purpose: "Dramatize Alder Gulch's transformation from gold discovery into a provisional society and show how distance, private arrangements, and exposed roads shape its people"
    status: "draft"
    participants:
      - "Henry Edgar"
      - "James Sheehan"
      - "Anne Sheehan"
      - "Mary Sheehan"
      - "Ellen Sheehan"
      - "Thomas Josiah Dimsdale"
      - "Jack Gallagher"
      - "George Ives"
    entry_state: "In May 1863 Alder Gulch has no settler community, only Indigenous histories the prospectors scarcely recognize and a creek in which six returning men find gold"
    turn: "The discovery becomes a rush, and claims, commerce, households, schools, and private agreements create a society without creating durable authority across its full length"
    exit_state: "By December the gulch sustains thousands but remains dependent on exposed roads that carry both necessities and portable wealth"
    must_not_reveal:
      - "The alleged road-agent network as an uncontested organized conspiracy"
      - "Gallagher's or Ives's guilt as a neutral fact rather than a later classification or accusation"
