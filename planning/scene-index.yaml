schema_version: 1
scenes:
  - id: "01.01"
    file: "manuscript/01.01-the-chase.md"
    title: "The Chase"
    date: "December 1863"
    pov: "Documentary narrator, limited around Nicholas Tiebolt"
    location: "Alder Gulch and the road near Dempsey's ranch"
    purpose: "Establish the frontier setting and institutional void, follow Tiebolt's pursuit and incapacitation, and create the demand for justice"
    status: "draft"
    participants:
      - "Nicholas Tiebolt"
      - "George Ives"
    entry_state: "Alder Gulch is rich, newly settled, and beyond effective territorial protection; Tiebolt is returning for mules with gold on his person"
    turn: "An unidentified pursuit resolves into George Ives overtaking Tiebolt"
    exit_state: "Tiebolt is barely alive, his gold is gone, and the narrative has established a need for justice without revealing the killing's gruesome details"
    must_not_reveal:
      - "The detailed mechanics and injuries associated with Tiebolt's death before the trial proceedings"
      - "The alleged road-agent network as settled historical fact"
  - id: "02.01"
    file: "manuscript/02.01-the-gulch.md"
    title: "The Gulch"
    date: "May–December 1863"
    pov: "Documentary narrator, moving among Henry Edgar and the Sheehan household"
    location: "Alder Gulch, principally Virginia City"
    purpose: "Dramatize Alder Gulch's transformation from gold discovery into a provisional society and show how distance, private arrangements, and exposed roads shape its people"
    status: "draft"
    participants:
      - "Henry Edgar"
      - "James Sheehan"
      - "Anne Sheehan"
      - "Mary Sheehan"
      - "Ellen Sheehan"
      - "Thomas Josiah Dimsdale"
      - "Jack Gallagher"
      - "George Ives"
    entry_state: "In May 1863 Alder Gulch has no settler community, only Indigenous histories the prospectors scarcely recognize and a creek in which six returning men find gold"
    turn: "The discovery becomes a rush, and claims, commerce, households, schools, and private agreements create a society without creating durable authority across its full length"
    exit_state: "By December the gulch sustains thousands but remains dependent on exposed roads that carry both necessities and portable wealth"
    must_not_reveal:
      - "The alleged road-agent network as an uncontested organized conspiracy"
      - "Gallagher's or Ives's guilt as a neutral fact rather than a later classification or accusation"
  - id: "03.01"
    file: "manuscript/03.01-the-roads.md"
    title: "The Roads"
    date: "October–December 1863"
    pov: "Documentary narrator, moving among travelers, freighters, passengers, and the Sheehan household"
    location: "The roads connecting Virginia City, Bannack, Salt Lake City, Fort Benton, and Lewiston"
    purpose: "Show persistent road violence progressively destroying the ordinary movement, commerce, trust, and family security on which Alder Gulch's emerging society depends"
    status: "draft"
    participants:
      - "James Sheehan"
      - "Anne Sheehan"
      - "Mary Sheehan"
      - "Ellen Sheehan"
      - "Lloyd Magruder"
      - "Henry Tilden"
      - "Samuel Hauser"
      - "Nathaniel Langford"
      - "Henry Plummer"
      - "Leroy Southmayd"
      - "Thomas Caldwell"
      - "George Ives"
      - "Anton Holter"
    entry_state: "Alder Gulch has become an interdependent society whose households and commerce rely upon exposed roads"
    turn: "A Southmayd-led sequence moves through attempted murder, armed commerce, a threatened young traveler, compromised public transportation, and finally the Magruder party's betrayal and murder"
    exit_state: "Travel continues, but families, merchants, drivers, passengers, and witnesses now understand every journey as a private defense against public danger"
    must_not_reveal:
      - "The alleged Plummer organization as established fact rather than the explanation imposed by Dimsdale and later vigilante writers"
      - "Disputed identifications or later reconstructions as direct neutral observation"
  - id: "04.01"
    file: "manuscript/04.01-the-body.md"
    title: "The Body"
    date: "December 1863"
    pov: "Documentary narrator, moving with William Palmer and the men who identify and bury Nicholas Tiebolt"
    location: "The Pas-sam-a-ri or Stinkingwater Valley and Nevada City"
    purpose: "Turn Tiebolt's disappearance into public knowledge through the discovery, identification, and burial of his body while preserving the community's inability to reconstruct the crime"
    status: "draft"
    participants:
      - "Nicholas Tiebolt"
      - "William Palmer"
      - "John Franck"
      - "George Hilderman"
      - "William Herren"
      - "Tom Baume"
      - "William Clark"
      - "Elk Morse"
      - "Butschy"
    entry_state: "Tiebolt has been absent for nine days, and the trust behind his ordinary mule errand increasingly appears misplaced"
    turn: "Baume recognizes Tiebolt through the borrowed knife, changing an unidentified victim into a known man whose disappearance was not desertion"
    exit_state: "Tiebolt is identified and buried; the killing is public fact, but its sequence, participants, and author remain unresolved"
    must_not_reveal:
      - "The sequence of the wound, restraint, dragging, concealment, or Tiebolt's consciousness as witnessed fact"
      - "George Ives as the killer before testimony and accusation establish the case against him"
      - "The employer Clark, Colorado knife-loan witness, and burial participant as definitively the same man"
