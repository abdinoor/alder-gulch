    classification: "documented fact"
  - id: "1863-12-tiebolt-errand-and-disappearance"
    date: "December 1863"
    event: "Nicholas Tiebolt leaves Nevada City carrying payment received for a span of mules and travels toward Dempsey's ranch to retrieve the animals; he does not return."
    classification: "documented in early accounts; Nevada City is a probable working base, while exact date, route, and domicile require further verification"
  - id: "1863-12-opening-pursuit"
    date: "December 1863"
    event: "The approved narrative reconstructs George Ives pursuing and overtaking Tiebolt, who is left barely alive; the exact chase and incapacitation are authorial reconstruction."
    classification: "authorial reconstruction based on later accusation and physical evidence"
