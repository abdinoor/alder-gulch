schema_version: 1
events:
  - id: "circa-1861-tiebolt-washington-gulch"
    date: "circa 1861"
    event: "Nicholas Tiebolt is in Washington Gulch, Colorado, where Tom Baume reportedly lends him a knife in the presence of John X. Beidler and William Clark."
    classification: "author-approved historical premise based on Dimsdale's 1866 account; exact date, duration, and locality require verification"
  - id: "1863-05-26-alder-gulch-discovery"
    date: "1863-05-26"
    event: "Six prospectors discover placer gold in Alder Gulch, prompting rapid settlement along the gulch."
    classification: "documented fact"
  - id: "1863-12-tiebolt-errand-and-disappearance"
    date: "December 1863"
    event: "Nicholas Tiebolt leaves Nevada City carrying payment received for a span of mules and travels toward Dempsey's ranch to retrieve the animals; he does not return."
    classification: "documented in early accounts; Nevada City is a probable working base, while exact date, route, and domicile require further verification"
  - id: "1863-12-opening-pursuit"
    date: "December 1863"
    event: "The approved narrative reconstructs George Ives pursuing and overtaking Tiebolt, who is left barely alive; the exact chase and incapacitation are authorial reconstruction."
    classification: "authorial reconstruction based on later accusation and physical evidence"
  - id: "1863-12-tiebolt-body-discovery"
    date: "December 1863, nine or ten days after Tiebolt's departure"
    event: "William Palmer reportedly finds Nicholas Tiebolt's frozen body in heavy sagebrush in the Pas-sam-a-ri or Stinkingwater Valley after shooting a grouse, transports it to Nevada City, and Tom Baume identifies Tiebolt through a borrowed knife."
    classification: "reported in early pro-vigilante accounts; observable injuries and identification are medium-confidence reports, while the killing sequence remains unresolved"
  - id: "1863-12-tiebolt-burial"
    date: "December 1863"
    event: "Elk Morse, William Clark, and Tom Baume reportedly procure a coffin and bury Nicholas Tiebolt above Nevada City."
    classification: "reported by Dimsdale; exact grave location and survival remain unknown"
